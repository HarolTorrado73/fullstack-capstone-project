apiVersion: apps/v1
kind: Deployment
metadata:
  name: giftwebsite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: giftwebsite
  template:
    metadata:
      labels:
        app: giftwebsite
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      imagePullSecrets:
        - name: icr

      containers:
        - name: giftwebsite
          image: us.icr.io/sn-labs-harolcamilom/giftwebsite
          ports:
            - containerPort: 9000

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: giftwebsite-service
spec:
  type: NodePort
  selector:
    app: giftwebsite
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000